    - region [ref=f3e339]:
      - generic [ref=f3e340]:
        - generic [ref=f3e341]:
          - generic [ref=f3e342]: Hizmetler
          - heading "Altı alanda, aynı standartla." [level=2] [ref=f3e344]
          - paragraph [ref=f3e345]: Hizmetlerimiz birbirini besler. Bir mülkü değerleyen ekip, onu pazarlayan ve devrini tamamlayan ekiple aynıdır.
        - list [ref=f3e346]:
          - listitem [ref=f3e347]:
            - heading "Satış ve Kiralama" [level=3] [ref=f3e351]
            - paragraph [ref=f3e352]: Konut ve ticari taşınmazların alım, satım ve kiralama süreçlerini baştan sona yürütürüz. Pazarlıktan tapuya kadar tek muhatap.
          - listitem [ref=f3e353]:
            - heading "Proje Pazarlama" [level=3] [ref=f3e358]
            - paragraph [ref=f3e359]: Butik konut projelerinin lansman öncesi konumlandırmasını ve satış sürecini üstleniriz. Doğru fiyatla doğru hızda satış.
          - listitem [ref=f3e360]:
            - heading "Yatırım Danışmanlığı" [level=3] [ref=f3e364]
            - paragraph [ref=f3e365]: Sermayenizi hangi bölgeye ve hangi ürüne yönlendireceğinizi rakamlarla belirleriz. Duygusal karar değil, getiri hesabı.
          - listitem [ref=f3e366]:
            - heading "Ekspertiz ve Değerleme" [level=3] [ref=f3e370]
            - paragraph [ref=f3e371]: Taşınmazın gerçek piyasa değerini bağımsız yöntemlerle tespit ederiz. Rapor, banka ve mahkeme süreçlerinde kullanılabilir nitelikte hazırlanır.
          - listitem [ref=f3e372]:
            - heading "Portföy Yönetimi" [level=3] [ref=f3e375]
            - paragraph [ref=f3e376]: Birden fazla taşınmazı olan mal sahipleri için kira, bakım ve doluluk yönetimini üstleniriz. Siz sadece geliri takip edersiniz.
          - listitem [ref=f3e377]:
            - heading "Yabancı Yatırımcı ve Oturum Süreçleri" [level=3] [ref=f3e383]
            - paragraph [ref=f3e384]: Yurt dışından gelen alıcılar için mülk seçiminden oturum iznine kadar tüm adımları yönetiriz. Süreç Türkçe bilmeden de tamamlanır.
