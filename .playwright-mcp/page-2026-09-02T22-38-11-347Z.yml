            - paragraph [ref=f3e60]: Zepel Gayrimenkul, 2008'de tek bir ofisle İstanbul'da kuruldu. Bugün Boğaz hattı, kuzey ormanları ve Ege kıyısında sınırlı sayıda mülkle çalışıyoruz. Her yıl incelediğimiz taşınmazların yalnızca küçük bir bölümü portföyümüze giriyor; konum, yapı kalitesi ve hukuki durum aynı anda karşılanmıyorsa mülkü listelemiyoruz.
            - paragraph [ref=f3e61]: Çalışma biçimimiz danışmanlık üzerine kurulu. Bir mülkü sunmadan önce imar durumunu, tapu kaydını, kat mülkiyetini ve bölgedeki gerçekleşmiş satış verilerini inceliyoruz. Alıcıya sunduğumuz her rakamın arkasında bir kaynak var. Satıcı tarafında ise fiyatı piyasaya değil, veriye göre konumlandırıyoruz.
          - list [ref=f3e62]:
            - listitem [ref=f3e63]:
              - heading "Tek danışman, tek muhatap" [level=3] [ref=f3e64]
              - paragraph [ref=f3e65]: İlk görüşmeden tapu devrine kadar süreci aynı kıdemli danışman yürütür. Dosyanız el değiştirmez.
            - listitem [ref=f3e66]:
              - heading "Sunum öncesi hukuki kontrol" [level=3] [ref=f3e67]
              - paragraph [ref=f3e68]: Tapu, imar, iskân ve ipotek kayıtları portföye alma aşamasında incelenir. Sürpriz, satıştan sonra değil öncesinde çıkar.
            - listitem [ref=f3e69]:
              - heading "Gerçekleşmiş satışa dayalı fiyat" [level=3] [ref=f3e70]
              - paragraph [ref=f3e71]: Değerleme, ilan fiyatlarına değil bölgede son 12 ayda kapanan işlemlere dayanır.
          - link "Ekibimizle tanışın" [ref=f3e73] [cursor=pointer]:
