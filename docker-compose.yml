# Yerel geliştirme ve production önizlemesi için tek servis.
# Kullanım: docker compose up --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: zepel-web:local
    container_name: zepel-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    # .env dosyası opsiyoneldir; yoksa bu satırı yorum satırı yapın.
    env_file:
      - path: .env
        required: false
    # Sertleştirme: yeni ayrıcalık kazanımı kapalı, tüm yetenekler düşürülmüş,
    # dosya sistemi salt okunur (Next.js yalnızca /tmp yazar).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Kaynak sınırı: tek örnekte spam veya kaçak süreç host'u tüketmesin.
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
